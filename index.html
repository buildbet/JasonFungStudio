<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="refresh" content="0; url=shopify-growth.html" />
    <script>
      window.location.replace(`shopify-growth.html${window.location.search}${window.location.hash}`);
    </script>
    <meta name="theme-color" content="#080908" />
    <meta
      name="description"
      content="Choose Shopify brand or agency support from Jason Fung Studio."
    />
    <title>Jason Fung Studio | Shopify Growth Support</title>
    <link rel="icon" href="assets/favicon.ico" sizes="any" />
    <link rel="icon" href="assets/favicon.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&amp;family=Instrument+Serif:ital@0;1&amp;display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #080908;
        --paper: #f1eee7;
        --muted: #b8b5ad;
        --line: rgba(255, 255, 255, 0.16);
        --serif: "Instrument Serif", Georgia, serif;
        --sans: "DM Sans", Arial, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        background: var(--ink);
        color: var(--paper);
        font-family: var(--sans);
        -webkit-font-smoothing: antialiased;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      main {
        min-height: 100vh;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: clamp(28px, 5vw, 72px);
      }

      .split-home {
        width: min(1040px, 100%);
        display: grid;
        gap: clamp(34px, 5vw, 64px);
      }

      .split-home__brand {
        margin: 0;
        display: inline-flex;
        align-items: center;
        gap: 12px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.12em;
        line-height: 1;
        text-transform: uppercase;
      }

      .split-home__logo {
        width: 34px;
        height: 34px;
        display: block;
        object-fit: contain;
      }

      .split-home h1 {
        max-width: 920px;
        margin: 0;
        font-family: var(--serif);
        font-size: clamp(54px, 8vw, 112px);
        font-weight: 400;
        letter-spacing: 0;
        line-height: 0.95;
      }

      .split-home__lede {
        max-width: 720px;
        margin: 0;
        color: #dedbd3;
        font-size: clamp(19px, 2vw, 28px);
        line-height: 1.42;
      }

      .split-home__paths {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        border-top: 1px solid var(--line);
        border-left: 1px solid var(--line);
      }

      .split-home__path {
        min-height: 172px;
        padding: clamp(26px, 4vw, 42px);
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 24px;
        border-right: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
        font-size: clamp(22px, 2.4vw, 34px);
        font-weight: 600;
        line-height: 1.08;
        transition:
          background 180ms ease,
          color 180ms ease;
      }

      .split-home__path span:last-child {
        flex: 0 0 auto;
        font-family: var(--serif);
        font-size: 1.1em;
        font-weight: 400;
        line-height: 0.8;
      }

      .split-home__path:hover,
      .split-home__path:focus-visible {
        background: var(--paper);
        color: var(--ink);
      }

      .split-home__path:focus-visible {
        outline: 2px solid var(--paper);
        outline-offset: 4px;
      }

      .split-home__work {
        width: max-content;
        max-width: 100%;
        min-height: 58px;
        padding: 0 28px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 22px;
        border: 1px solid rgba(255, 255, 255, 0.28);
        border-radius: 999px;
        background: rgba(241, 238, 231, 0.08);
        color: var(--paper);
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.02em;
        transition:
          background 180ms ease,
          color 180ms ease,
          border-color 180ms ease,
          transform 180ms ease;
      }

      .split-home__work:hover,
      .split-home__work:focus-visible {
        border-color: var(--paper);
        background: var(--paper);
        color: var(--ink);
        transform: translateY(-2px);
      }

      .split-home__work span:last-child {
        font-family: var(--serif);
        font-size: 1.15em;
        line-height: 0.8;
      }

      @media (max-width: 680px) {
        main {
          align-items: end;
        }

        .split-home__logo {
          width: 30px;
          height: 30px;
        }

        .split-home__paths {
          grid-template-columns: 1fr;
        }

        .split-home__path {
          min-height: 132px;
        }
      }
    </style>
  </head>
  <body>
    <main aria-labelledby="split-home-title">
      <section class="split-home">
        <p class="split-home__brand">
          <img
            class="split-home__logo"
            src="assets/jf-logo-white.png"
            alt=""
            width="34"
            height="34"
          />
          <span>Jason Fung Studio</span>
        </p>
        <h1 id="split-home-title">Who are you here for?</h1>
        <div class="split-home__paths" aria-label="Choose your path">
          <a class="split-home__path" href="shopify-growth.html">
            <span>I'm a Shopify brand</span>
            <span aria-hidden="true">&rarr;</span>
          </a>
          <a class="split-home__path" href="partners.html">
            <span>I'm an agency or team</span>
            <span aria-hidden="true">&rarr;</span>
          </a>
        </div>
        <a class="split-home__work" href="selected-work.html">
          <span>View selected work</span>
          <span aria-hidden="true">&rarr;</span>
        </a>
      </section>
    </main>
  </body>
</html>
